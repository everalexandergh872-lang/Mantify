<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net https://cdnjs.cloudflare.com https://www.gstatic.com; frame-src 'self' https://*.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Mantify · Control de Mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="img/svg/favicon.svg">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#0F2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mantify">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" integrity="sha384-qn4Jh88HhJA8dplNQyGjOh9OGI4izVhrfj/qIFgaKcdgOE06pXqIKGlsCILZcLAC" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" integrity="sha384-TnlRYaR4JYz/lpaGuaiU61PjNberSA4vjLjtF+oRC/IkohkJqnWxw5EmDSOt1vA1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js" integrity="sha384-3IYu+dnH2y9gX1s6p9F4D55XbEmZBfJ3D1Ylh8J6bfdqnJCOmDVSRTq1yhJsBY1H" crossorigin="anonymous"></script>
<link rel="stylesheet" href="styles.css">
<script>try{if(localStorage.getItem('theme')==='light'){document.documentElement.classList.add('light');document.querySelector('meta[name=theme-color]').setAttribute('content','#ffffff')}}catch(e){}</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

<script src="config.js"></script>

<aside id="side" aria-label="Menú principal"></aside>

<header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30" style="padding-top:env(safe-area-inset-top)">
  <div class="max-w-6xl mx-auto px-3 py-2 flex items-center justify-between gap-2">
    <div class="min-w-0">
      <h1 class="font-bold text-white leading-tight truncate" style="display:flex;align-items:center;gap:.45rem"><svg width="24" height="24" viewBox="0 0 64 64" role="img" aria-label="Mantify"><circle cx="32" cy="32" r="23" fill="none" stroke="#2DD4BF" stroke-width="8" stroke-dasharray="9.03 9.03"/><circle cx="32" cy="32" r="21" fill="#2DD4BF"/><path d="M22.5 32.5 L29 39 L42 25.5" fill="none" stroke="#0F2A44" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="font-family:'Space Grotesk',Inter,system-ui,sans-serif;font-size:1.15rem;letter-spacing:-.03em">mantify</span></h1>
      <p id="sync" class="text-[11px] text-slate-400">Conectando…</p>
    </div>
    <nav id="nav" class="text-sm">
      <button id="t-dash" onclick="tab('dash')" class="btn navb"><span class="ic">📊</span><span class="lbl">Inicio</span></button>
      <button id="t-back" onclick="tab('back')" class="btn navb"><span class="ic">🔧</span><span class="lbl">Backlogs</span></button>
      <button id="t-pm" onclick="tab('pm')" class="btn navb"><span class="ic">🗓️</span><span class="lbl">Preventivos</span></button>
      <button id="t-plan" onclick="tab('plan')" class="btn navb" style="display:none"><span class="ic">📅</span><span class="lbl">Planificación</span></button>
      <button id="t-gr" onclick="eqnRoute='dashboard';tab('gr')" class="btn navb"><span class="ic">🛢️</span><span class="lbl">Engrase y Neumáticos</span></button>
      <button id="t-tr" onclick="tab('tr')" class="btn navb" hidden aria-hidden="true"><span class="ic">🛞</span><span class="lbl">Neumáticos</span></button>
      <button id="t-rep" onclick="tab('rep')" class="btn navb"><span class="ic">📝</span><span class="lbl">Reporte</span></button>
      <button id="t-fleet" onclick="tab('fleet')" class="btn navb"><span class="ic">🚜</span><span class="lbl">Equipos</span></button>
      <button id="t-sup" onclick="tab('sup')" class="btn navb"><span class="ic">🛡️</span><span class="lbl">Supervisor</span></button>
      <button id="t-adm" onclick="tab('adm')" class="btn navb"><span class="ic">⚙️</span><span class="lbl">Admin</span></button>
    </nav>
    <div class="gsearch lap-only"><input id="gsearch" type="search" placeholder="Buscar backlog, equipo, N° RQ u OT… (Enter)" onkeydown="if(event.key==='Enter'){gSearch(this.value);this.select()}" autocomplete="off"></div>
    <div id="userbox" class="flex items-center gap-2 text-xs" style="flex-shrink:0"></div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-3 py-4">
  <section id="v-dash" class="space-y-4"></section>
  <section id="v-back" class="hidden space-y-3"></section>
  <section id="v-gr" class="hidden"></section>
  <section id="v-tr" class="hidden"></section>
  <div id="eqn-host" class="hidden">
    <p id="eqn-err" class="hidden text-sm text-amber-400 mb-2"></p>
    <iframe id="eqn-frame" title="Engrase y Neumáticos" style="width:100%;height:70vh;border:1px solid #334155;border-radius:.75rem;display:block;background:transparent" allow="camera"></iframe>
  </div>
  <section id="v-plan" class="hidden space-y-3"></section>
  <section id="v-rep" class="hidden space-y-3"></section>
  <section id="v-fleet" class="hidden space-y-3">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex gap-2">
      <input id="qf" class="inp" placeholder="Buscar código, marca, modelo o serie…" oninput="renderFleet()">
      <button id="bt-fleet" onclick="openFleet()" class="btn bg-amber-500 text-slate-950 whitespace-nowrap">+ Equipo</button>
      <button id="bt-fimp" onclick="openFleetImport()" class="btn bg-slate-700 whitespace-nowrap">📥 Importar</button>
      <button id="bt-fdelall" onclick="openFleetDelAll()" class="btn bg-red-500/20 text-red-400 whitespace-nowrap" title="Borrar todos los equipos">🗑️ Borrar todos</button>
    </div>
    <div id="list-fleet" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="tbl-fleet" class="lap-only"></div>
  </section>
  <section id="v-pm" class="hidden space-y-3">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col sm:flex-row gap-2">
      <input id="qpm" class="inp sm:flex-1" placeholder="Buscar equipo, plan o responsable…" oninput="renderPm()">
      <select id="fpm" class="inp sm:w-44" onchange="renderPm()"><option value="">Todos</option><option value="PROGRAMADO">Programados</option><option value="VENCIDO">Vencidos</option><option value="PENDIENTE_VALIDACION">Por validar</option><option value="COMPLETADO">Completados</option></select>
      <button id="bt-pm" onclick="openPm()" class="btn bg-amber-500 text-slate-950">+ Programar</button>
      <button id="bt-imp" onclick="openImport()" class="btn bg-slate-700">📥 Importar</button>
      <button id="bt-mod-pm" onclick="openModEq('pm')" class="btn bg-slate-700 whitespace-nowrap" style="display:none">🧩 Equipos</button>
    </div>
    <div id="list-pm" class="grid gap-3 md:grid-cols-2"></div>
    <div id="tbl-pm" class="lap-only"></div>
  </section>
  <section id="v-sup" class="hidden space-y-3"></section>
  <section id="v-adm" class="hidden space-y-4"></section>
</main>

<button id="fab" type="button" onclick="quickAdd()" aria-label="Registro rápido" style="position:fixed;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:35;width:54px;height:54px;border-radius:50%;background:#f59e0b;color:#0f172a;font-size:30px;font-weight:800;line-height:1;border:0;box-shadow:0 4px 14px rgba(0,0,0,.45)">+</button>
<div id="login" style="display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:#0f172a;align-items:center;justify-content:center;padding:1rem;overflow:auto"></div>
<div id="modal" class="fixed inset-0 z-50 bg-black/70 hidden items-end sm:items-center justify-center p-2" onclick="if(event.target===this)hide()"></div>

<script src="backlog.js"></script>
<script src="formatos.js"></script>
<script src="planner.js"></script>
<script src="eqn-host.js"></script>
<script src="app.js"></script>
</body>
</html>
